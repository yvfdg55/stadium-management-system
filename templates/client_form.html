<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ 'تعديل عميل' if client else 'إضافة عميل' }} | Happy Family Resort</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('theme_css') }}">
  <script src="{{ url_for('static', filename='js/theme.js') }}" defer></script>
  {% include '_pwa_head.html' %}
</head>
<body>
  {% include "_admin_nav.html" %}
  <main class="page-shell narrow">
    <header class="page-header">
      <div>
        <p class="eyebrow">نظام إدارة الملعب</p>
        <h1>{{ 'تعديل عميل' if client else 'إضافة عميل' }}</h1>
      </div>
      <a class="button-link secondary" href="{{ url_for('clients_list') }}">العودة</a>
    </header>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="alert {{ category }}" role="alert">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    <form method="post" class="form-card">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
      <label for="name">الاسم</label>
      <input id="name" name="name" type="text" value="{{ client['name'] if client else '' }}" required autofocus>

      <label for="phone">رقم الهاتف</label>
      <input id="phone" name="phone" type="tel" value="{{ client['phone'] if client else '' }}" required>

      <label for="notes">ملاحظات</label>
      <textarea id="notes" name="notes" rows="5">{{ client['notes'] if client else '' }}</textarea>

      <button type="submit">حفظ</button>
    </form>
  </main>
  <button class="theme-toggle" data-theme-toggle type="button" aria-label="تبديل الوضع" aria-pressed="false"></button>
</body>
</html>

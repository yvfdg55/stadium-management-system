<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>لوحة الإدارة | إدارة الملعب</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('theme_css') }}">
</head>
<body>
  <main class="auth-shell">
    <section class="auth-card" aria-labelledby="page-title">
      <div class="brand-mark" aria-hidden="true">م</div>
      <p class="eyebrow">نظام إدارة الملعب</p>
      <h1 id="page-title">مرحبًا، {{ username }}</h1>
      <p class="muted">تم تسجيل الدخول بنجاح.</p>
      <a class="button-link" href="{{ url_for('booking_screen') }}">عرض مواعيد الملعب</a>
      <a class="button-link" href="{{ url_for('clients_list') }}">إدارة العملاء</a>
      <a class="button-link" href="{{ url_for('admin_reports') }}">التقارير</a>
      <a class="button-link" href="{{ url_for('settings_page') }}">الإعدادات</a>
      <form method="post" action="{{ url_for('logout') }}">
        <button type="submit" class="secondary">تسجيل الخروج</button>
      </form>
    </section>
  </main>
</body>
</html>

<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تسجيل الدخول | إدارة الملعب</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <main class="auth-shell">
    <section class="auth-card" aria-labelledby="page-title">
      <div class="brand-mark" aria-hidden="true">م</div>
      <p class="eyebrow">نظام إدارة الملعب</p>
      <h1 id="page-title">تسجيل الدخول</h1>
      <p class="muted">أدخل بيانات المسؤول للمتابعة.</p>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
          <div class="alert {{ category }}" role="alert">{{ message }}</div>
        {% endfor %}
      {% endwith %}

      <form method="post" class="login-form">
        <label for="username">اسم المستخدم</label>
        <input id="username" name="username" type="text" autocomplete="username" required autofocus>

        <label for="password">كلمة المرور</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>

        <button type="submit">دخول</button>
      </form>
    </section>
  </main>
</body>
</html>
